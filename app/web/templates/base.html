<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CalcView Migrator{% endblock %}</title>
  <style>
    :root {
      --fg: #1d2330; --muted: #5d6675; --line: #d9dde4; --bg: #ffffff; --panel: #f6f7f9;
      --accent: #1f5fbf; --bad: #b42318; --warn: #a15c00; --ok: #2d6a2d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: var(--fg); background: var(--bg); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav.top { display: flex; gap: 16px; align-items: baseline; padding: 6px 16px;
              background: #20283a; color: #fff; }
    nav.top a { color: #fff; }
    nav.top .brand { font-weight: 600; margin-right: 12px; }
    nav.top .project { margin-left: auto; color: #c6ccd8; font-size: 12px; }
    main { padding: 12px 16px; }
    h1 { font-size: 18px; margin: 4px 0 8px; }
    h2 { font-size: 15px; margin: 14px 0 6px; }
    h3 { font-size: 13px; margin: 12px 0 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { background: var(--panel); font-weight: 600; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: #fafbfc; }
    code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                       font-size: 12px; }
    pre { background: var(--panel); border: 1px solid var(--line); padding: 8px;
          overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
    code.raw { background: #fff3e0; border: 1px solid #f0d2a8; padding: 0 3px; border-radius: 2px; }
    .not-parsed, .bad { color: var(--bad); font-weight: 600; }
    .muted { color: var(--muted); }
    .error { color: var(--bad); }
    .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px;
             border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
    .badge.ok { color: var(--ok); border-color: #b9d8b9; background: #eef7ee; }
    .badge.partial, .badge.warning { color: var(--warn); border-color: #ecd2a5; background: #fdf5e6; }
    .badge.failed, .badge.error { color: var(--bad); border-color: #f0b8b3; background: #fdecea; }
    .callout { border: 1px solid var(--line); border-left: 4px solid var(--warn);
               background: #fffaf2; padding: 8px 12px; margin: 8px 0; }
    .callout.bad { border-left-color: var(--bad); background: #fff5f4; }
    .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 6px; }
    .facts dt { color: var(--muted); display: inline; }
    .facts dd { display: inline; margin: 0 0 0 4px; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 10px 0; }
    .tabs a { padding: 5px 12px; border: 1px solid transparent; border-bottom: none;
              border-radius: 3px 3px 0 0; color: var(--fg); }
    .tabs a.active { border-color: var(--line); background: var(--bg); font-weight: 600;
                     margin-bottom: -1px; }
    form.inline { display: inline; }
    input[type=text] { font: inherit; padding: 3px 6px; border: 1px solid #b8bfcb; border-radius: 3px; }
    button { font: inherit; padding: 3px 10px; border: 1px solid #9aa3b2; border-radius: 3px;
             background: var(--panel); cursor: pointer; }
    button:hover { background: #eceff3; }
    {% block style %}{% endblock %}
  </style>
  <script src="/static/vendor/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="top">
    <a class="brand" href="/">CalcView Migrator</a>
    <a href="/views">Views</a>
    {% if project %}<span class="project">{{ project.name }} &middot; {{ project.source_folder }}</span>{% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
